<svg xmlns="http://www.w3.org/2000/svg" width="540" height="250" viewBox="0 0 540 250">
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset=".6" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1233"/><stop offset="1" stop-color="#06070f"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#8b5cff" stop-opacity=".7"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></radialGradient>
<clipPath id="cl"><rect x="6" y="6" width="528" height="238" rx="18"/></clipPath>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.rot{animation:r 14s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes r{to{transform:rotate(360deg)}}
.fl{animation:f 5s ease-in-out infinite}@keyframes f{0%,100%{opacity:.5}50%{opacity:1}}
.in{animation:i .9s ease both}@keyframes i{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pg{transform-box:fill-box;transform-origin:left;animation:p 4s ease-in-out infinite}@keyframes p{0%{transform:scaleX(.08)}70%,100%{transform:scaleX(.72)}}
.arr{animation:a 1.6s ease-in-out infinite}@keyframes a{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
</style>
</defs>
<rect x="6" y="6" width="528" height="238" rx="18" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
<g clip-path="url(#cl)">
<circle cx="470" cy="70" r="120" fill="url(#orb)" class="fl"/>
<circle class="rot" cx="460" cy="80" r="46" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 8" opacity=".7"/>
<circle class="rot" cx="460" cy="80" r="30" fill="none" stroke="#ff3df2" stroke-width="1.5" stroke-dasharray="2 6" opacity=".7" style="animation-direction:reverse"/>
<circle cx="460" cy="80" r="6" fill="#fff" filter="url(#glow)"/>
</g>
<g class="in">
<rect x="32" y="32" width="119" height="24" rx="12" fill="url(#bd)" opacity=".9"/>
<text x="91" y="48.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#05060f">COMING SOON</text>
<text x="32" y="102" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="url(#ttl)" filter="url(#glow)">Next Build</text>
<text x="32" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="2" fill="#8ea0ff">LOADING SOMETHING BIG</text>
<text x="32" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfd6ff">Something exciting is being built. Stay tuned.</text>
<text x="32" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cfd6ff" opacity="0"></text>
<rect x="32" y="172" width="400" height="10" rx="5" fill="#1a2250"/><rect class="pg" x="32" y="172" width="400" height="10" rx="5" fill="url(#bd)"/>

<text x="32" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="3" fill="#7f8bd6">STATUS · COMPILING...</text>
<g class="arr"><text x="508" y="228" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#00f0ff">FOLLOW →</text></g>
</g>
</svg>